name: Actualizar precios

on:
  schedule:
    # Todos los días a las 09:00 de Chile. GitHub usa hora UTC y Chile cambia de horario,
    # así que se programa a las 12:07 y 13:07 UTC y el paso de abajo deja correr solo la
    # primera que caiga desde las 9:00 de Chile (una vez por día).
    - cron: '7 12 * * *'
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        type: choice
        options: [actualizar, solo-pagina, diagnostico]
        default: actualizar
  push:
    branches: [main]
    paths: ['build/template.html', 'build/catalog.json', 'build/comunas.json', 'build/update.py']

permissions:
  contents: write
  issues: write

concurrency: precios

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer distribuidoras y generar la página
        id: up
        env:
          BASE_KEY: ${{ secrets.BASE_KEY }}
          MODO: ${{ github.event_name == 'push' && 'solo-pagina' || inputs.modo || 'actualizar' }}
          TZ: America/Santiago
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "schedule" ]; then
            H=$(date +%H); HOY=$(date +%F)
            ULT=$(python -c "import json;print(json.load(open('build/catalog.json'))['updated'])")
            if [ "$H" -lt 9 ] || [ "$ULT" = "$HOY" ]; then echo "Hoy ya se actualizó o aún no son las 9:00 en Chile ($H h)"; exit 0; fi
          fi
          case "$MODO" in
            solo-pagina) python build/update.py --render ;;
            diagnostico) python build/update.py --dump ;;
            *)           python build/update.py ;;
          esac
      - name: Guardar lo leído (para revisar errores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diag/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publicar
        env:
          MODO: ${{ github.event_name == 'push' && 'solo-pagina' || inputs.modo || 'actualizar' }}
        run: |
          git config user.name "Pedido del Viernes"
          git config user.email "actions@users.noreply.github.com"
          git add index.html build/catalog.json build/base.enc build/historial.csv INFORME.md 2>/dev/null || true
          if [ "$MODO" = "diagnostico" ]; then git add -f diag/ || true; fi
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Precios $(date +%d-%m-%Y)" && git push; fi
      - name: Avisar por correo (aviso de GitHub)
        if: steps.up.outputs.notify == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ steps.up.outputs.title }}" --body-file INFORME.md
